# Tata Curvv Accomplished S: 10.25-inch HARMAN touchscreen, 1920x720 panel (~200 ppi).
# Android Auto projects 1920x1080 and the head unit crops 180 px top and bottom (marginheight 360).
# Same preset as Overworld Maps, plus the sensors a parked app depends on: Android Auto shows
# DwellPlay only while these say the car is parked.
[general]
# Right-hand drive: Android Auto puts its cards and rail on the driver's side.
driverposition = right
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1920x1080
marginheight = 360
dpi = 200
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
speed = true
gear = true
parking_brake = true
