// Plain Kotlin: the media model, the safety policy and the network clients. No Android here, so
// the rules that keep video off the car screen while driving run as fast JVM tests.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    api platform('com.squareup.okhttp3:okhttp-bom:5.3.2')
    api 'com.squareup.okhttp3:okhttp'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver3'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
